spring:
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000
  thymeleaf:
    enable: true

envio:
  email:
    remetente: ${EMAIL_REMETENTE:}
    nomeRemetente: ${EMAIL_NOME_REMETENTE:Agendador de Tarefas}

server:
  port: 8082
